<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dostuna Köprü Kur — 9 Soru, 1 Mutlu Son</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#21452b; --page2:#173320;
  --wood:#8a5a32; --wood-dark:#5e3a1d; --wood-light:#a8723f;
  --sign:#f6e3bd; --sign-ink:#3d2612;
  --navy:#22406b; --navy-dark:#162a48;
  --gold:#ffd447; --gold-dark:#c99a12;
  --bad:#e0574f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#13281a; --page2:#0c1a10; --sign:#ead3a6; } }
:root[data-theme="dark"]{ --page:#13281a; --page2:#0c1a10; --sign:#ead3a6; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,var(--page) 0%,var(--page2) 100%);background-color:var(--page2);
  font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:#fff;
}
.app{height:100%;width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#2a2622;position:relative}
@media (min-width:620px){ .app{height:calc(100% - 32px);margin:16px auto;border-radius:30px;overflow:hidden;border:5px solid var(--wood);box-shadow:0 8px 0 var(--wood-dark),0 20px 50px rgba(0,0,0,.4)} }

.woodsign{
  display:inline-block;background:linear-gradient(180deg,var(--wood-light),var(--wood));color:var(--sign);
  font-weight:800;line-height:1;padding:7px 14px 4px;border-radius:12px;
  box-shadow:inset 0 -4px 0 var(--wood-dark),inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 rgba(0,0,0,.28);
  text-shadow:0 2px 0 var(--wood-dark)
}

/* ---- sahne ---- */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:linear-gradient(180deg,#5fb4e6 0%,#a6daf2 30%,#e2f2e6 48%,#bfdcae 100%)}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.qLabel{font-size:1.25rem;transform:rotate(-2deg)}
.prog{display:flex;align-items:center;gap:3px;background:rgba(61,38,18,.55);padding:5px 8px;border-radius:12px}
.prog .pl{width:13px;height:18px;border-radius:3px;border:2px dashed rgba(255,255,255,.5)}
.prog .pl.on{border:0;background:linear-gradient(90deg,#b07a45,#8f5c2c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.prog .key{font-size:1.05rem;margin-left:4px;line-height:1}
.sceneSign{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:1.1rem;white-space:nowrap}
.sceneSign.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6)}70%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
.bubble{
  position:absolute;right:10px;bottom:10px;max-width:66%;
  background:var(--sign);color:var(--sign-ink);font-weight:700;font-size:1rem;line-height:1.2;
  padding:7px 12px 5px;border-radius:14px 14px 14px 4px;box-shadow:0 4px 0 rgba(0,0,0,.25)
}
.heart{position:absolute;font-size:30px;pointer-events:none;animation:float 1.8s ease-out forwards}
@keyframes float{0%{transform:translate(-50%,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-120px) scale(1.2);opacity:0}}
.finale{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;background:rgba(18,30,14,.35)}
.finale[hidden]{display:none}
.finale .woodsign{font-size:clamp(1.7rem,8vw,2.4rem);padding:12px 22px 8px;text-align:center}

/* ---- taş tablet ---- */
.tablet{
  flex:none;padding:12px 12px 14px;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.07) 0 14%,transparent 15%),
    radial-gradient(circle at 85% 75%,rgba(0,0,0,.10) 0 12%,transparent 13%),
    linear-gradient(160deg,#7b7872,#5a5752);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.08),0 -6px 0 rgba(0,0,0,.18);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center
}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.target{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#2f5d96,var(--navy));color:#fff;border-radius:16px;
  font-size:clamp(2.4rem,11vw,3.2rem);font-weight:800;line-height:1;padding:8px 0 2px;
  box-shadow:0 0 0 3px #8fd3ff,0 0 16px 3px rgba(79,182,255,.7),inset 0 -5px 0 var(--navy-dark);transition:box-shadow .3s,background .3s
}
.target.key{background:linear-gradient(180deg,#d9a520,#a87610);box-shadow:0 0 0 3px #ffe9a0,0 0 20px 5px rgba(255,212,71,.85),inset 0 -5px 0 #7d5608}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--sign);color:var(--sign-ink);font-weight:800;border-radius:8px;padding:3px 10px 1px;font-size:.95rem;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.eq{
  text-align:center;background:var(--sign);color:var(--sign-ink);
  font-size:clamp(1.3rem,6vw,1.65rem);font-weight:800;line-height:1;padding:8px 6px 4px;border-radius:12px;
  box-shadow:inset 0 -4px 0 rgba(94,58,29,.25),0 4px 0 rgba(0,0,0,.28)
}
.ring{position:relative;width:min(48vw,200px,27dvh);aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{
  position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  font:inherit;font-weight:800;font-size:clamp(1.1rem,5.4vw,1.5rem);color:#fff;cursor:pointer;padding:3px 0 0;
  background:radial-gradient(circle at 35% 30%,#3b5f8f,var(--navy-dark));border:3px solid #9aa3ad;
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:box-shadow .2s,border-color .2s;touch-action:manipulation
}
.node.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,212,71,.5),0 0 14px 5px rgba(255,212,71,.75)}
.node.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(224,87,79,.5),0 0 12px 4px rgba(224,87,79,.7)}
.node:disabled{cursor:default}
.node:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ring.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.btn{font:inherit;font-weight:800;font-size:1.15rem;border:0;border-radius:14px;padding:8px 26px 6px;background:var(--gold);color:var(--sign-ink);cursor:pointer;box-shadow:0 5px 0 var(--gold-dark)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-dark)}
body.embed .tablet{display:none}
@media (prefers-reduced-motion: reduce){ .heart{animation-duration:.01s} .ring.shake,.sceneSign.pop{animation:none} }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="hud">
      <div class="woodsign qLabel" id="qLabel">1. Soru</div>
      <div class="prog" id="prog" aria-label="İlerleme"></div>
    </div>
    <div class="woodsign sceneSign" id="sceneSign">Köprüyü kur!</div>
    <div class="bubble" id="bubble">Dayan dostum, sana köprü kuruyorum!</div>
    <div class="finale" id="finale" hidden>
      <div class="woodsign">9 Soru, 1 Mutlu Son! 🐾</div>
      <button class="btn" id="again">Tekrar oyna</button>
    </div>
  </div>

  <section class="tablet" aria-live="polite">
    <div class="left">
      <div class="target" id="target">13</div>
      <div class="tags"><div class="tag">İşlem: +</div><div class="tag">Adım: 2</div></div>
      <div class="eq" id="eq">? + ? = 13</div>
    </div>
    <div class="ring" id="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <circle cx="50" cy="50" r="36" fill="none" stroke="#4a4844" stroke-width="5"/>
        <circle cx="50" cy="50" r="36" fill="none" stroke="#8d8a84" stroke-width="2.2"/>
        <line id="link" x1="0" y1="0" x2="0" y2="0" stroke="#ffd447" stroke-width="3" stroke-linecap="round" filter="url(#gl)" visibility="hidden"/>
      </svg>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ==================================================================
  // 1) OYUN MANTIĞI: 8 soru = 8 tahta, 9. soru = kapı
  // ==================================================================
  const CFG = { planks: 8 };
  const TOTAL = CFG.planks + 1;
  const S = { solved: 0, placed: 0, status: 'playing', rescueT: 0, cheerT: 0, sadT: 0 };
  const embed = new URLSearchParams(location.search).has('embed');
  if (embed) document.body.classList.add('embed');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CHEERS = ['Bir tahta daha!', 'Harika gidiyoruz!', 'Süpersin!', 'Devam, devam!', 'Çok iyi!'];
  function bubbleFor(n) {
    if (n === 0) return 'Dayan dostum, sana köprü kuruyorum!';
    if (n === 4) return 'Köprünün yarısı tamam!';
    if (n === CFG.planks - 1) return 'Son tahta geliyor!';
    if (n === CFG.planks) return 'Köprü hazır! Şimdi kilidi açalım.';
    if (n > CFG.planks) return 'Gel buraya dostum!';
    return CHEERS[n % CHEERS.length];
  }
  function signFor(n) {
    if (n < CFG.planks) return 'Köprüyü kur!';
    if (n === CFG.planks) return 'Kilidi aç! 🔑';
    return 'Kavuşma zamanı!';
  }

  function notify(evt, data = {}) {
    const msg = JSON.stringify({ evt, ...data });
    try { if (window.AndroidBridge && window.AndroidBridge.postMessage) window.AndroidBridge.postMessage(msg); } catch (e) {}
    try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {}
  }

  function onCorrect() {
    if (S.status !== 'playing') return;
    S.solved++; S.cheerT = 1.4;
    if (S.solved <= CFG.planks) addPlank();
    renderProg(); bubble.textContent = bubbleFor(S.solved);
    if (S.solved === CFG.planks || S.solved === TOTAL) setSign(signFor(S.solved));
    notify('progress', { solved: S.solved, planks: S.placed, total: TOTAL });
    if (S.solved >= TOTAL) { S.status = 'rescued'; S.rescueT = 0; notify('rescued'); }
    else if (!embed) setTimeout(newQuestion, 900);
  }
  function onWrong() {
    if (S.status !== 'playing') return;
    S.sadT = 1.1; wobbleT = .5;
    bubble.textContent = 'Hmm, bir daha deneyelim!';
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => { if (S.status === 'playing') bubble.textContent = bubbleFor(S.solved); }, 1500);
  }
  function start() {
    Object.assign(S, { solved: 0, placed: 0, status: 'playing', rescueT: 0, cheerT: 0, sadT: 0 });
    finale.hidden = true; heartsShown = finaleShown = confettiOn = false;
    setSign(signFor(0)); bubble.textContent = bubbleFor(0); renderProg();
    resetScene();
    if (!embed) newQuestion();
    notify('start');
  }
  window.rescue = { start, onCorrect, onWrong, config: CFG, state: S };

  // ==================================================================
  // 2) ARAYÜZ
  // ==================================================================
  const stage = document.getElementById('stage');
  const signEl = document.getElementById('sceneSign'), bubble = document.getElementById('bubble'), finale = document.getElementById('finale');
  const ring = document.getElementById('ring'), link = document.getElementById('link');
  const targetEl = document.getElementById('target'), eqEl = document.getElementById('eq'), qLabel = document.getElementById('qLabel');
  const progEl = document.getElementById('prog');
  document.getElementById('again').addEventListener('click', start);
  let bubbleTimer = 0, heartsShown = false, finaleShown = false, confettiOn = false, wobbleT = 0;

  function renderProg() {
    let h = '';
    for (let i = 0; i < CFG.planks; i++) h += `<span class="pl${i < S.placed ? ' on' : ''}"></span>`;
    h += `<span class="key">${S.solved >= TOTAL ? '🔓' : '🔒'}</span>`;
    progEl.innerHTML = h;
  }
  function setSign(t) { signEl.textContent = t; signEl.classList.remove('pop'); void signEl.offsetWidth; signEl.classList.add('pop'); }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  let Q = null, picked = [], nodeEls = [];
  function newQuestion() {
    const set = new Set(); while (set.size < 6) set.add(rnd(2, 12));
    const nums = [...set];
    const i = rnd(0, 5); let j = rnd(0, 5); while (j === i) j = rnd(0, 5);
    Q = { nums, target: nums[i] + nums[j] };
    picked = [];
    const isKey = S.solved === CFG.planks;
    qLabel.textContent = isKey ? 'Son soru' : `${S.solved + 1}. Soru`;
    targetEl.textContent = Q.target; targetEl.classList.toggle('key', isKey);
    eqEl.textContent = `? + ? = ${Q.target}`;
    link.setAttribute('visibility', 'hidden');
    nodeEls.forEach(n => n.remove()); nodeEls = [];
    nums.forEach((v, k) => {
      const a = -Math.PI / 2 + k * Math.PI * 2 / 6;
      const x = 50 + Math.cos(a) * 36, y = 50 + Math.sin(a) * 36;
      const b = document.createElement('button');
      b.className = 'node'; b.textContent = v; b.style.left = x + '%'; b.style.top = y + '%';
      b.dataset.x = x; b.dataset.y = y; b.setAttribute('aria-label', `Sayı ${v}`);
      b.addEventListener('click', () => pick(k));
      ring.appendChild(b); nodeEls.push(b);
    });
  }
  function drawLink(a, b, color) {
    link.setAttribute('x1', nodeEls[a].dataset.x); link.setAttribute('y1', nodeEls[a].dataset.y);
    link.setAttribute('x2', nodeEls[b].dataset.x); link.setAttribute('y2', nodeEls[b].dataset.y);
    link.setAttribute('stroke', color); link.setAttribute('visibility', 'visible');
  }
  function pick(k) {
    if (S.status !== 'playing' || picked.length >= 2) return;
    if (picked[0] === k) { picked = []; nodeEls[k].classList.remove('sel'); eqEl.textContent = `? + ? = ${Q.target}`; return; }
    picked.push(k); nodeEls[k].classList.add('sel');
    const [a, b] = picked;
    if (picked.length === 1) { eqEl.textContent = `${Q.nums[a]} + ? = ${Q.target}`; return; }
    const sum = Q.nums[a] + Q.nums[b];
    if (sum === Q.target) {
      drawLink(a, b, '#ffd447'); eqEl.textContent = `${Q.nums[a]} + ${Q.nums[b]} = ${Q.target}`;
      nodeEls.forEach(n => n.disabled = true); onCorrect();
    } else {
      drawLink(a, b, '#e0574f');
      nodeEls[a].classList.add('bad'); nodeEls[b].classList.add('bad');
      eqEl.textContent = `${Q.nums[a]} + ${Q.nums[b]} = ${sum}`;
      ring.classList.remove('shake'); void ring.offsetWidth; ring.classList.add('shake');
      onWrong();
      setTimeout(() => {
        [a, b].forEach(i => nodeEls[i] && nodeEls[i].classList.remove('sel', 'bad'));
        link.setAttribute('visibility', 'hidden'); picked = [];
        if (S.status === 'playing') eqEl.textContent = `? + ? = ${Q.target}`;
      }, 750);
    }
  }
  function hearts(worldPos, n = 5) {
    if (reduceMotion) return;
    const v = worldPos.clone().project(camera);
    const x = (v.x * .5 + .5) * stage.clientWidth, y = (-v.y * .5 + .5) * stage.clientHeight;
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div');
      h.className = 'heart'; h.textContent = '❤️';
      h.style.left = x + 'px'; h.style.top = y + 'px';
      h.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
      h.style.animationDelay = (i * .22) + 's';
      stage.appendChild(h); setTimeout(() => h.remove(), 3000);
    }
  }

  // ==================================================================
  // 3) SAHNE — dünya yerelde x ekseninde kurulur, sonra derinliğe çevrilir
  //    (yerel +x = uzak taraf/kafes, yerel -x = yakın taraf/sahibi)
  // ==================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);

  const C = h => new THREE.Color(h).convertSRGBToLinear();
  const M = (h, o = {}) => new THREE.MeshStandardMaterial({ color: C(h), roughness: .85, ...o });
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(C(0xd9efe4), 26, 80);
  const world = new THREE.Group(); world.rotation.y = Math.PI / 2; scene.add(world);
  const camera = new THREE.PerspectiveCamera(46, 9 / 12, .1, 200);

  scene.add(new THREE.HemisphereLight(C(0xcfe9ff), C(0x5f8a3a), .8));
  const sun = new THREE.DirectionalLight(C(0xfff0d2), 2.4);
  sun.position.set(-8, 13, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 14, bottom: -12, near: 1, far: 50 });
  scene.add(sun);
  const rim = new THREE.DirectionalLight(C(0xbfe3ff), .9); rim.position.set(6, 7, -10); scene.add(rim);

  function mesh(geo, mat, x = 0, y = 0, z = 0, parent = world) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
  }
  const S32 = r => new THREE.SphereGeometry(r, 32, 24);
  const noise3 = (x, y, z) => Math.sin(x * 1.7 + z * .9) * .5 + Math.sin(y * 2.3 + x * 1.1) * .3 + Math.sin(z * 2.9 + y * 1.3 + x * .4) * .2;

  // ---------- kayalıklar ----------
  const rockMat = M(0x9b8f7e, { flatShading: true, roughness: .95 }), rockDark = M(0x7c7264, { flatShading: true, roughness: .95 });
  const grassMat = M(0x6db347, { roughness: .9 });
  const GROUND = .05, EDGE = 3.9;
  function cliff(x0, x1, top, bottom, d) {
    const w = x1 - x0, h = top - bottom, cx = (x0 + x1) / 2, cy = (top + bottom) / 2;
    const g = new THREE.BoxGeometry(w, h, d, Math.ceil(w * 1.3), Math.ceil(h * 1.3), Math.ceil(d * 1.3));
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const wx = x + cx, wy = y + cy, isTop = y > h / 2 - 1e-3;
      x += noise3(wx * .9, wy * .9, z * .9) * .4; z += noise3(z * .8 + 3, wx * .8, wy * .8 + 1) * .4;
      if (!isTop) y += noise3(wy, z, wx) * .25;
      p.setXYZ(i, x, y, z);
    }
    g.computeVertexNormals();
    mesh(g, rockMat, cx, cy, 0);
    mesh(new THREE.BoxGeometry(w + .5, .3, d + .5), grassMat, cx, top - .1, 0);
    const lip = new THREE.SphereGeometry(.32, 8, 6), edgeX = x0 < 0 ? x1 : x0;
    for (let z = -d / 2; z <= d / 2; z += .55) {
      const s = mesh(lip, grassMat, edgeX + (x0 < 0 ? .2 : -.2), top - .14, z + (Math.random() - .5) * .2);
      s.scale.set(.8, .45 + Math.random() * .3, 1);
    }
  }
  cliff(-22, -EDGE, 0, -7, 26);
  cliff(EDGE, 22, 0, -7, 26);
  const floor = mesh(new THREE.PlaneGeometry(8.5, 60), M(0x5d9a3e), 0, -6.4, 0); floor.rotation.x = -Math.PI / 2;
  const streamMat = new THREE.MeshStandardMaterial({ color: C(0x63c3ee), roughness: .15, metalness: .1, transparent: true, opacity: .85 });
  const stream = mesh(new THREE.PlaneGeometry(2.2, 60), streamMat, 0, -6.35, 0); stream.rotation.x = -Math.PI / 2; stream.castShadow = false;
  for (let i = 0; i < 16; i++) {
    const r = mesh(new THREE.DodecahedronGeometry(.25 + Math.random() * .35, 0), rockDark, (Math.random() < .5 ? -1 : 1) * (1.3 + Math.random() * 1.8), -6.3, -18 + Math.random() * 30);
    r.rotation.set(Math.random(), Math.random(), Math.random());
  }

  // ---------- bitki örtüsü ----------
  const trunkMat = M(0x7a4e2b), leafMats = [M(0x3f9a3a, { flatShading: true }), M(0x58b04a, { flatShading: true }), M(0x2f7d34, { flatShading: true })];
  const leafGeo = new THREE.IcosahedronGeometry(1, 1);
  function tree(x, z, s = 1) {
    const g = new THREE.Group(); g.position.set(x, GROUND, z); world.add(g);
    mesh(new THREE.CylinderGeometry(.14 * s, .22 * s, 1.8 * s, 7), trunkMat, 0, .9 * s, 0, g).rotation.z = (Math.random() - .5) * .15;
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {

  const pup = makePuppy(), owner = makeOwner();

  const lerp = (a, b, k) => a + (b - a) * k;

  const look = new THREE.Vector3(0, .3, -.8), lockWorld = new THREE.Vector3(), tmp = new THREE.Vector3();

  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now; t += dt;
    if (S.status === 'rescued') S.rescueT += dt;
    S.cheerT = Math.max(0, S.cheerT - dt); S.sadT = Math.max(0, S.sadT - dt); wobbleT = Math.max(0, wobbleT - dt);
    const rt = S.rescueT, rescued = S.status === 'rescued';

    // tahtalar
    planks.forEach((pl, i) => {
      if (!pl.visible) return;
      const age = t - pl.userData.t0, d = dusts[i], p = Math.min(1, age / .55);
      pl.position.y = pl.userData.baseY + (1 - bounce(p)) * 3.2;
      pl.rotation.z = (1 - p) * pl.userData.spin;
      ghosts[i].visible = false;
      const da = age - .3;
      if (da > 0 && da < .9) {
        d.mat.opacity = .7 * (1 - da / .9);
        d.puffs.forEach((pf, k) => {
          const a = k / d.puffs.length * Math.PI * 2;
          pf.visible = true; pf.position.set(d.x + Math.cos(a) * (.3 + da * .9), d.y + .05 + da * .4, Math.sin(a) * (.5 + da * .9));
          pf.scale.setScalar(1 + da * 2.5);
        });
      } else d.puffs.forEach(pf => pf.visible = false);
    });
    ghosts.forEach((g, i) => { g.position.z = (i === S.placed && wobbleT > 0) ? Math.sin(t * 50) * .08 : 0; });
    ghostMat.opacity = .16 + Math.sin(t * 3) * .06;

    // kilit: köprü bitince parlar, 9. doğru cevapta kırılır
    const keyPhase = S.solved >= N && !rescued;
    lock.getWorldPosition(lockWorld);
    if (rescued && rt < .7) {
      const p = rt / .7; spark.visible = true; spark.position.copy(lockWorld).add(tmp.set(.2, .15, .25));
      spark.scale.setScalar(.3 + Math.sin(p * Math.PI) * 1.3); spark.material.rotation = p * 2;
    } else if (keyPhase) {
      const p = (t % 1.6) / 1.6; spark.visible = p < .4; spark.position.copy(lockWorld).add(tmp.set(.2, .15, .25));
      spark.scale.setScalar(Math.sin(p / .4 * Math.PI) * .6); spark.material.rotation = t;
    } else spark.visible = false;
    if (S.sadT > .6 && keyPhase) lock.position.z = -DW - .02 + Math.sin(t * 60) * .015; else lock.position.z = -DW - .02;
    let doorTarget = 0;
    if (rescued) {
      shackle.rotation.z = lerp(shackle.rotation.z, 1, Math.min(1, dt * 6));
      const q = Math.max(0, Math.min(1, (rt - .35) / .7));
      lock.position.y = 1.1 - q * q * 1.1; lock.rotation.z = q * 2.4; lock.visible = q < 1;
      if (rt > .7) doorTarget = -1.9;
    }
    door.rotation.y = lerp(door.rotation.y, doorTarget, Math.min(1, dt * 3));

    // ---- köpek ----
    const P = pup, prog = S.placed / N;
    blinkP -= dt; if (blinkP < -.13) blinkP = 2 + Math.random() * 3;
    const hugging = rescued && rt > HUG_AT;
    const happy = rescued ? 1 : Math.min(1, .1 + prog * .8 + (S.cheerT > 0 ? .2 : 0) - (S.sadT > 0 ? .15 : 0));
    const eyeS = hugging ? .3 : blinkP < 0 ? .1 : 1;
    P.eyes.forEach(e => e.scale.y = lerp(e.scale.y, eyeS, .45));
    const sad = Math.max(0, 1 - happy) * .45;
    P.brows[0].rotation.z = lerp(P.brows[0].rotation.z, -sad, .15);
    P.brows[1].rotation.z = lerp(P.brows[1].rotation.z, sad, .15);
    P.smile.visible = happy > .4; P.frown.visible = happy <= .25; P.tongue.visible = happy > .8;
    P.bang.visible = keyPhase; if (keyPhase) P.bang.scale.setScalar(1 + Math.sin(t * 8) * .1);
    P.ears.forEach((e, i) => e.rotation.z = lerp(e.rotation.z, (i ? 1 : -1) * (sad * .5 - (S.cheerT > 0 ? Math.sin(t * 16) * .12 : 0)), .2));
    P.tail.rotation.set(-.8 + (1 - happy) * .9, 0, Math.sin(t * (2 + happy * 16)) * (.2 + happy * .5));
    let pLeg = 0;
    if (!rescued || rt < WALK_START) {
      const hop = rescued || keyPhase ? Math.abs(Math.sin(t * 9)) * .25 : S.cheerT > 0 ? Math.abs(Math.sin(t * 10)) * .2 * Math.min(1, S.cheerT) : 0;
      P.root.position.set(PUP_HOME.x, PUP_HOME.y + hop, PUP_HOME.z);
      // yüzü köprüye ve sahibine dönük (yerel -x), hafif kameraya
      P.root.rotation.y = lerp(P.root.rotation.y, (S.cheerT > 0 || keyPhase || rescued) ? -1.45 : -1.25 + Math.sin(t * .5) * .25, .08);
      P.head.rotation.x = lerp(P.head.rotation.x, prog < .25 ? .12 : -.08, .1);
      P.root.rotation.x = 0;
    } else if (!hugging) {
      const u = Math.min(1, (rt - WALK_START) / WALK_DUR), p = walkCurve.getPointAt(u), tg = walkCurve.getTangentAt(u);
      pLeg = Math.sin(t * 15) * .6;
      P.root.position.copy(p); P.root.position.y += Math.abs(Math.sin(t * 15)) * .06;
      P.root.rotation.y = lerp(P.root.rotation.y, Math.atan2(tg.x, tg.z), .2);
    } else {
      const end = walkCurve.getPointAt(1);
      P.root.position.set(end.x, end.y + .18 + Math.abs(Math.sin(t * 5)) * .06, end.z);
      P.root.rotation.y = lerp(P.root.rotation.y, -2.85, .1);
      P.root.rotation.x = lerp(P.root.rotation.x, -.45, .1);
      P.head.rotation.set(.2, .3, Math.sin(t * 3) * .08);
      pLeg = 0; P.legs[0].rotation.x = P.legs[1].rotation.x = -1.2;
    }
    if (!hugging) { P.legs[0].rotation.x = pLeg; P.legs[1].rotation.x = -pLeg; }
    P.legs[3].rotation.x = pLeg; P.legs[2].rotation.x = -pLeg;

    // ---- sahibi ----
    const O = owner;
    blinkO -= dt; if (blinkO < -.13) blinkO = 2.5 + Math.random() * 3;
    O.eyes.forEach(e => e.scale.y = lerp(e.scale.y, hugging ? .3 : blinkO < 0 ? .1 : 1, .45));
    let oLeg = 0;
    if (!hugging) {
      const cheer = S.cheerT > 0 || (rescued && rt < WALK_START + 1);
      const watching = rescued;
      const hop = cheer ? Math.abs(Math.sin(t * 9)) * .16 : 0;
      O.root.position.set(OWNER_HOME.x, OWNER_HOME.y + hop, OWNER_HOME.z);
      // normalde köprüye bakar; sevinirken oyuncuya döner
      const face = cheer && !watching ? -.9 : watching ? 1.1 : 1.25 + Math.sin(t * .4) * .15;
      O.root.rotation.y = lerp(O.root.rotation.y, face, .08);
      const wave = !cheer && !watching && Math.sin(t * .7) > .55;
      O.arms[1].rotation.x = lerp(O.arms[1].rotation.x, 0, .15);
      O.arms[1].rotation.z = lerp(O.arms[1].rotation.z, cheer ? 2.7 : wave ? 2.5 + Math.sin(t * 10) * .35 : .2, .15);
      O.arms[0].rotation.x = lerp(O.arms[0].rotation.x, watching ? -1 : 0, .15);
      O.arms[0].rotation.z = lerp(O.arms[0].rotation.z, cheer ? -2.7 : watching ? .3 : -.2, .15);
      O.head.rotation.z = lerp(O.head.rotation.z, wave ? .12 : 0, .1);
      O.root.rotation.x = 0;
      O.smile.scale.set(cheer || watching ? 1.3 : 1, cheer || watching ? 1.25 : 1, 1);
    } else {
      O.root.position.set(OWNER_HOME.x, OWNER_HOME.y + Math.abs(Math.sin(t * 5)) * .05, OWNER_HOME.z);
      O.root.rotation.y = lerp(O.root.rotation.y, -.4, .1);
      O.root.rotation.x = lerp(O.root.rotation.x, .12, .08);
      O.arms[0].rotation.x = lerp(O.arms[0].rotation.x, -1.35, .12); O.arms[0].rotation.z = lerp(O.arms[0].rotation.z, .6, .12);
      O.arms[1].rotation.x = lerp(O.arms[1].rotation.x, -1.35, .12); O.arms[1].rotation.z = lerp(O.arms[1].rotation.z, -.6, .12);
      O.head.rotation.set(.12, .25, Math.sin(t * 3) * .06);
      O.smile.scale.set(1.35, 1.3, 1);
      if (!heartsShown) {
        heartsShown = true; bubble.textContent = 'Kavuştuk! Seni çok özledim!';
        O.root.getWorldPosition(tmp); tmp.y += 2.3; tmp.x += .4; hearts(tmp.clone());
        spawnConfetti();
      }
      if (!finaleShown && rt > HUG_AT + 2.4) { finaleShown = true; finale.hidden = false; document.getElementById('again').focus(); }
    }
    O.legs[0].rotation.x = oLeg; O.legs[1].rotation.x = -oLeg;

    if (confettiOn) for (const c of confetti) {
      if (!c.visible) continue;
      const u = c.userData; c.position.y += u.vy * dt; c.position.x += u.vx * dt;
      c.rotation.x += u.rs[0] * dt; c.rotation.y += u.rs[1] * dt; c.rotation.z += u.rs[2] * dt;
      if (c.position.y < GROUND) c.visible = false;
    }
    clouds.forEach((c, i) => { c.position.x += dt * (.25 + i * .05); if (c.position.x > 45) c.position.x = -45; });
    streamMat.opacity = .8 + Math.sin(t * 2) * .05;

    // ---- kamera: sahibinin arkasından köprü boyunca kafese bakar ----
    let focusZ = -.8;
    if (rescued && rt > WALK_START && !hugging) { pup.root.getWorldPosition(tmp); focusZ = Math.max(-.8, Math.min(2.6, tmp.z * .55)); }
    if (hugging) focusZ = 2.2;
    look.z = lerp(look.z, focusZ, Math.min(1, dt * 1.3));
    const sway = reduceMotion ? 0 : Math.sin(t * .25) * .3;
    camera.position.set(1.4 + sway, 7.2 * camDist, look.z + 13.2 * camDist);
    camera.lookAt(look);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camDist = Math.max(.85, Math.min(1.4, .82 / camera.aspect));
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();
  start();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
